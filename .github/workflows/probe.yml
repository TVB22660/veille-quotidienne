name: Sondage temporaire (saints)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Sonder les sources
        run: python probe_saints.py
        continue-on-error: true
      - name: Publier le résultat
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add probe_saints.txt
          git commit -m "Sondage saints $(date -u +%F-%H%M)"
          git pull --rebase origin main
          git push
