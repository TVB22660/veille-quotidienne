yaml
name: Veille quotidienne

on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC = 5h30 (été) / 4h30 (hiver), heure de Paris
  workflow_dispatch:        # permet de lancer à la main

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lire les flux RSS
        run: python fetch.py
      - name: Publier le fichier
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille.txt
          if ! git diff --cached --quiet; then
            git commit -m "Veille du $(date -u +%F)"
            git push
          fi
